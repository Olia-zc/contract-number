<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>律所合同编号生成器</title>
    <style>
        body{text-align:center;margin-top:80px;font-size:18px;}
        #getBtn{padding:15px 40px;font-size:20px;cursor:pointer;background:#2c5282;color:#fff;border:none;border-radius:8px;}
        #result{margin-top:30px;font-size:28px;font-weight:bold;color:#d9251d;}
        #tip{margin-top:15px;color:#666;font-size:16px;}
    </style>
</head>
<body>
    <h3>合同4位编号生成器</h3>
    <button id="getBtn">点击获取合同编号</button>
    <div id="result"></div>
    <div id="tip"></div>

    <script>
        const btn = document.getElementById('getBtn');
        const res = document.getElementById('result');
        const tip = document.getElementById('tip');
        const min = 1000;
        const max = 9999;

        // 获取当前年月（格式：2026-06）
        function getYearMonth(){
            const now = new Date();
            let y = now.getFullYear();
            let m = now.getMonth() + 1;
            m = m < 10 ? '0' + m : m;
            return `${y}-${m}`;
        }

        const currentYM = getYearMonth();
        // 读取本地存储数据
        let store = JSON.parse(localStorage.getItem('monthlyNumData')) || {};

        // 月份不同则清空历史，自动重置编号
        if(store.yearMonth !== currentYM){
            store = {
                yearMonth: currentYM,
                usedNums: []
            };
        }

        btn.onclick = function(){
            const used = store.usedNums;
            // 判断当月编号是否用尽
            if(used.length >= max - min + 1){
                res.innerText = "";
                tip.innerText = "本月所有编号已用完，下月自动重置！";
                return;
            }

            let num;
            // 循环获取当月未使用的编号
            do{
                num = Math.floor(Math.random() * 9000 + 1000);
            }while(used.includes(num));

            used.push(num);
            // 更新本地存储
            localStorage.setItem('monthlyNumData', JSON.stringify(store));

            res.innerText = "本次编号：" + num;
            tip.innerText = `当前月份：${currentYM} | 本月已用编号：${used.length}`;
        }
    </script>
</body>
</html>
